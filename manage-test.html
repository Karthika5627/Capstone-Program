<!-- Add New Test -->
<div class="form-box">

    <h2>Add New Test</h2>

    <input type="text" id="testName" placeholder="Test Name">

    <input type="text" id="testCategory" placeholder="Category">

    <input type="number" id="testPrice" placeholder="Price">

    <button type="button" onclick="addTest()">Add Test</button>

</div>


<!-- Available Tests -->
<div class="table-box">

    <h2>Available Tests</h2>

    <table id="testTable">

        <tr>
            <th>Test ID</th>
            <th>Test Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <!-- Existing Test -->
        <tr>
            <td>101</td>
            <td>Blood Test</td>
            <td>Pathology</td>
            <td>500</td>

            <td>

                <button type="button" onclick="editTest(this)">
                    Edit
                </button>

                <button type="button" onclick="deleteTest(this)">
                    Delete
                </button>

                <a href="book-test.html">
                    <button type="button">
                        Book Now
                    </button>
                </a>

            </td>
        </tr>

    </table>

</div>
<script src="js/script.js"></script>
</body>
</html>
