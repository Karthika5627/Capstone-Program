
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Lab Test</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <!-- Heading -->
                <div class="card-header bg-primary text-white text-center py-4">
                    <h2>📅 Book Lab Test</h2>
                </div>

                <!-- Booking Form -->
                <div class="card-body">

                    <form>

                        <!-- Patient Name -->
                        <div class="mb-3">
                            <label class="form-label">Patient Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" class="form-control" placeholder="Enter your phone number">
                        </div>

                        <!-- Test -->
                        <div class="mb-3">
                            <label class="form-label">Select Test</label>

                            <select class="form-select">

                                <option>Blood Test</option>
                                <option>Sugar Test</option>
                                <option>Thyroid Test</option>
                                <option>Vitamin D Test</option>
                                <option>Urine Test</option>
                                <option>Liver Function Test</option>

                            </select>

                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label class="form-label">Booking Date</label>
                            <input type="date" class="form-control">
                        </div>

                        <!-- Time -->
                        <div class="mb-3">
                            <label class="form-label">Preferred Time</label>
                            <input type="time" class="form-control">
                        </div>

                        <!-- Notes -->
                        <div class="mb-3">
                            <label class="form-label">Additional Notes</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                        <!-- Button -->
                        <a href="success.html" class="btn btn-primary w-100">
    ✅ Confirm Booking
</a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
